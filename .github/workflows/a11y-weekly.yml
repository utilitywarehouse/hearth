name: Weekly Accessibility Report

# Runs every Storybook story for hearth-react and hearth-react-native with a11y
# checks set to fail (VITE_A11Y_STRICT=true). The report job then:
#   - writes a detailed report (run summary + `a11y-report` artifact),
#   - keeps one Linear issue per failing component,
#   - posts to Slack, unless nothing changed since the last post.
# Non-blocking: PR runs keep a11y as 'todo'. Replaces Chromatic's a11y tests.
#
# Secrets:
#   NPM_GLOBAL_READ_TOKEN  Existing token for installing private packages.
#   DS_SLACK_BOT           Slack bot token (chat:write) used to post the weekly
#                          report. The bot must be a member of the channel.
#   LINEAR_API_KEY         Optional. Linear API key that can create issues in
#                          UWDS. Without it the Linear step is skipped.

on:
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC
  workflow_dispatch:
    inputs:
      force_slack:
        description: Post to Slack even if nothing changed since the last post
        type: boolean
        default: false
      sync_linear:
        description: Create and update Linear issues
        type: boolean
        default: true

concurrency:
  group: a11y-weekly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Storybook a11y (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package: [react, react-native]
    container:
      # Keep in sync with test-react.yml / test-react-native.yml
      # https://playwright.dev/docs/docker#pull-the-image
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.8.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_GLOBAL_READ_TOKEN }}

      # Same as test-react.yml: hearth-react's workspace deps resolve from dist/.
      - if: matrix.package == 'react'
        run: pnpm run build:react

      # Same as test-react-native.yml, where `turbo run test` builds these first
      # (dependsOn ^build): Storybook imports hearth-fonts and hearth-react-icons
      # from dist/, so without this every story file fails to load.
      # Run turbo through a package script like every other workflow does; under
      # `pnpm exec` in this container turbo can't spawn pnpm for the package builds.
      - if: matrix.package == 'react-native'
        run: pnpm run build:react-native:deps

      # Violations fail individual stories; the job carries on so results always
      # upload. The report job decides the run's final status.
      - name: Run stories with strict a11y checks
        continue-on-error: true
        working-directory: packages/${{ matrix.package }}
        run: pnpm exec vitest run --project storybook --reporter=default --reporter=json --outputFile=a11y-results.json
        env:
          VITE_A11Y_STRICT: 'true'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: a11y-${{ matrix.package }}
          path: packages/${{ matrix.package }}/a11y-results.json
          if-no-files-found: warn
          retention-days: 30

  report:
    name: Report
    needs: test
    # Not always(): a cancelled run has no results worth reporting.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # to download the previous run's report
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # The report script only uses Node built-ins, so no install is needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.x'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: a11y-*
          path: a11y-results

      # The last report's state.json tells the script whether anything changed.
      # With none (first run, or expired artifact), it posts.
      - name: Download the previous report
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
        run: |
          for id in $(gh run list --workflow a11y-weekly.yml --branch "$REF" --status completed \
              --limit 10 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$id" --name a11y-report --dir previous-report; then
              echo "Comparing with the report from run $id"
              break
            fi
          done

      # Writes the run summary and report files, syncs Linear, posts to Slack if
      # anything changed (Slack/Linear failures are logged, not fatal), and exits 1
      # if any package has violations or didn't run.
      - name: Report, sync Linear and post to Slack
        run: node scripts/a11y-report/index.mjs
        env:
          RESULTS_DIR: a11y-results
          REPORT_DIR: a11y-report
          PREVIOUS_STATE: previous-report/state.json
          FORCE_SLACK: ${{ inputs.force_slack }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          SLACK_BOT_TOKEN: ${{ secrets.DS_SLACK_BOT }}
          SLACK_CHANNEL_ID: C04MYV3Q30F
          # Scheduled runs have no inputs, so check the event too.
          LINEAR_API_KEY: ${{ (github.event_name == 'schedule' || inputs.sync_linear) && secrets.LINEAR_API_KEY || '' }}
          LINEAR_TEAM_KEY: UWDS
          LINEAR_LABEL: Accessibility
          LINEAR_EXTRA_LABELS: engineering
          LINEAR_PROJECT_ID: P-UWDS-2975

      # report.md (findings by component), findings.json and state.json. Kept
      # longer than the raw results so next week's run can compare against it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: a11y-report
          path: a11y-report/
          if-no-files-found: warn
          retention-days: 90
