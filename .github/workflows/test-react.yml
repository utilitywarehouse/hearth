name: Test React
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/test-react.yml'
      - 'packages/react/**'

permissions:
  contents: read

jobs:
  checks:
    name: Build and Test
    runs-on: ubuntu-latest
    container:
      # Make sure to grab the latest version of the Playwright image
      # https://playwright.dev/docs/docker#pull-the-image
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.8.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_GLOBAL_READ_TOKEN }}
      # packages/react depends on workspace packages (hearth-react-icons, hearth-fonts, etc.)
      # whose package.json main/module/exports point at dist/ — build them first so Vite can
      # resolve those entries, otherwise Storybook fails with "Failed to resolve entry for package".
      - run: pnpm run build:react
      - run: pnpm run test:react
