name: Docker Build & Push
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/storybook-docker.yml'
      - 'apps/server-storybook-docs/**'
      - 'apps/usage-analytics/**'

permissions:
  contents: read

jobs:
  build-and-push-storybook:
    name: Build & Push
    runs-on:
      - nscloud-ubuntu-24.04-amd64-4x8-with-cache
      - nscloud-cache-tag-cmsv2-build
      - nscloud-cache-size-20gb
      - nscloud-exp-container-image-cache
      - nscloud-exp-runner-tool-cache-10gb
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        # only login if on main branch
      - name: Login to registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.uw.systems
          username: ${{ secrets.DOCKER_ID }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: registry.uw.systems/design-systems/storybook
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.number }},enable=${{ github.event_name == 'pull_request' }}

      # Docker is automatically setup by using the remote Namespace runner
      # this remote runner enables better caching & more performance for container builds.
      # i.e. don't call `docker/setup-buildx-action`
      - name: Build and push Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          file: apps/server-storybook-docs/Dockerfile
          context: .
          # only push if on main branch
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          secrets: |
            npm_token=${{ secrets.NPM_GLOBAL_READ_TOKEN }}

  # The deployment runs the mutable `:main` tag with `imagePullPolicy: Always`,
  # so restarting it is enough to pick up the image pushed above.
  restart-storybook:
    name: Restart prod deployment
    needs: build-and-push-storybook
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Internal runner with access to the prod-aws Kubernetes API
    runs-on: system-prod-aws
    concurrency:
      group: storybook-restart
      cancel-in-progress: false
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # Uses the runner's prod-aws cluster config, authenticated as the
      # storybook-github-actions service account in design-systems.
      - name: Restart storybook deployment
        env:
          K8S_TOKEN: ${{ secrets.K8S_PROD_AWS_STORYBOOK_TOKEN }}
        run: |
          set -euo pipefail
          k() { kubectl --context prod-aws --namespace design-systems --token "$K8S_TOKEN" "$@"; }

          k rollout restart deployment/storybook

          if ! k rollout status deployment/storybook --timeout=600s; then
            echo "::error::storybook rollout failed or timed out"
            k get deployment storybook -o wide || true
            k get pods -l app=storybook -o wide || true
            exit 1
          fi
