name: Figma Code Connect publish
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  code-connect:
    name: Code Connect
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.8.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
      - run: pnpm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_GLOBAL_READ_TOKEN }}

      - name: Publish React Figma Code Connect
        working-directory: ./packages/react
        run: pnpm run figma:publish --token=${{ secrets.FIGMA_ACCESS_TOKEN }}

      - name: Publish React Native Figma Code Connect
        working-directory: ./packages/react-native
        run: pnpm run figma:publish --token=${{ secrets.FIGMA_ACCESS_TOKEN }}

      - name: Publish React Icons Figma Code Connect
        working-directory: ./packages/react-icons
        run: pnpm run figma:publish --token=${{ secrets.FIGMA_ACCESS_TOKEN }}

      - name: Publish React Native Icons Figma Code Connect
        working-directory: ./packages/react-native-icons
        run: pnpm run figma:publish --token=${{ secrets.FIGMA_ACCESS_TOKEN }}

      - name: Publish SVG Assets - React Figma Code Connect
        working-directory: ./packages/svg-assets
        run: pnpm run figma:publish:react --token=${{ secrets.FIGMA_ACCESS_TOKEN }}

      - name: Publish SVG Assets - React Native Figma Code Connect
        working-directory: ./packages/svg-assets
        run: pnpm run figma:publish:react-native --token=${{ secrets.FIGMA_ACCESS_TOKEN }}
