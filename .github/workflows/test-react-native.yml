name: '🧪 Test React Native'
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/test-react-native.yml'
      - 'packages/react-native/**'
      - 'packages/tokens/src/ts/**'

permissions:
  contents: read

jobs:
  tokens-drift:
    name: Vendored tokens in sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code 📥
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js environment 🌐
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
      - name: Re-vendor tokens and fail on drift 🔍
        run: |
          node packages/react-native/scripts/copyTokens.js > /dev/null
          if [ -n "$(git status --porcelain -- packages/react-native/src/tokens)" ]; then
            git status --short -- packages/react-native/src/tokens
            echo "::error::packages/react-native/src/tokens is out of date. Run 'pnpm --dir packages/react-native run copyTokens' and commit the result."
            exit 1
          fi

  checks:
    name: Build and Test
    runs-on: ubuntu-latest
    container:
      # Make sure to grab the latest version of the Playwright image
      # https://playwright.dev/docs/docker#pull-the-image
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Setup pnpm 🛠️
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.8.0
      - name: Checkout code 📥
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js environment 🌐
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
      - name: Install dependencies 📦
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_GLOBAL_READ_TOKEN }}
      - name: Run React Native tests ✅
        run: pnpm run test:react-native
