name: 'Chromatic - React Native Expo'

# Opt-in only: native builds run on an expensive macOS runner and every
# snapshot counts towards the Chromatic quota, so this workflow does nothing
# unless the PR has the `chromatic: React Native` label. The label is the only
# opt-in signal — a text marker in the title/body was dropped because PR
# descriptions that merely mentioned the marker also matched.
# Pushes to main only build when the merged PR had the label (so the baseline
# stays in step with what was reviewed), and `workflow_dispatch` forces a build
# (e.g. to capture a fresh baseline). See the `chromatic-react-native-opt-in`
# skill for when a change warrants opting in.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'apps/storybook-rn-expo/**'
      - 'packages/react-native/**'
      - 'packages/react-native-icons/**'
      - 'packages/fonts/**'
      - '.github/workflows/chromatic-react-native-expo.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/storybook-rn-expo/**'
      - 'packages/react-native/**'
      - 'packages/react-native-icons/**'
      - 'packages/fonts/**'
      - '.github/workflows/chromatic-react-native-expo.yml'
  workflow_dispatch:

concurrency:
  # Unrelated `labeled` events get their own group, so adding some other label
  # never cancels an in-flight build.
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
      (github.event.action == 'labeled' && github.event.label.name != 'chromatic: React Native')
      && format('-{0}', github.run_id) || ''
    }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OPT_IN_LABEL: 'chromatic: React Native'

jobs:
  check:
    name: Check if build should run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed on push to look up the labels of the PR that was merged.
      pull-requests: read
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for opt-in
        id: opt_in
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          LABELED_NAME: ${{ github.event.label.name }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          SHA: ${{ github.sha }}
        run: |
          opted_in=false

          case "$EVENT_NAME" in
            workflow_dispatch)
              opted_in=true
              ;;
            pull_request)
              if [[ "$EVENT_ACTION" == "labeled" ]]; then
                # Only the opt-in label itself starts a build — any other label
                # means the PR either already built on an earlier event or
                # still isn't opted in.
                if [[ "$LABELED_NAME" == "$OPT_IN_LABEL" ]]; then
                  opted_in=true
                fi
              elif jq -e --arg label "$OPT_IN_LABEL" 'index($label) != null' <<< "$PR_LABELS" > /dev/null; then
                opted_in=true
              fi
              ;;
            push)
              labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '.[0].labels // [] | map(.name)')
              if jq -e --arg label "$OPT_IN_LABEL" 'index($label) != null' <<< "${labels:-[]}" > /dev/null; then
                opted_in=true
              fi
              ;;
          esac

          echo "Opted in: $opted_in"
          echo "opted_in=$opted_in" >> "$GITHUB_OUTPUT"

      - name: Check for non-docs changes
        id: changed
        if: steps.opt_in.outputs.opted_in == 'true' && github.event_name != 'workflow_dispatch'
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            apps/storybook-rn-expo/**
            packages/react-native/**
            packages/react-native-icons/**
            packages/fonts/**
          files_ignore: |
            **/*.docs.mdx
            **/*.md
            **/*.mdx

      - name: Decide
        id: decide
        env:
          OPTED_IN: ${{ steps.opt_in.outputs.opted_in }}
          ANY_CHANGED: ${{ steps.changed.outputs.any_changed }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$OPTED_IN" == "true" && "$ANY_CHANGED" == "true" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  chromatic:
    name: Build and publish to Chromatic
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: macos-latest-xlarge
    # A hung Chromatic build otherwise holds this runner until GitHub's 6h cap.
    timeout-minutes: 45
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.8.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_GLOBAL_READ_TOKEN }}

      - name: Build workspace dependencies
        # @utilitywarehouse/hearth-react-native's package.json `main` points at
        # build/index.js (tsc output) — pnpm install alone doesn't produce that.
        # Locally it already exists from prior `pnpm build` runs; a fresh CI
        # checkout has no such artifact, so Metro fails to resolve the package.
        #
        # Not using turbo here: `turbo run build` (with or without --no-daemon,
        # which turned out to be a deprecated no-op) fails outright on this
        # runner — "unable to spawn child process: No such file or directory" for
        # every package's build script regardless of what that script actually
        # runs, in under 300ms. Something about turbo's own process-spawning is
        # broken on this macOS runner; plain `pnpm --filter` spawning works fine
        # (this job's own `pnpm install` step already ran postinstall scripts
        # successfully), so build the packages storybook-rn-expo actually needs
        # directly instead of routing through turbo's task graph.
        run: |
          pnpm --filter @utilitywarehouse/hearth-fonts run build
          pnpm --filter @utilitywarehouse/hearth-react-icons run build
          pnpm --filter @utilitywarehouse/hearth-react-native-icons run build
          pnpm --filter @utilitywarehouse/hearth-react-native run build

      - name: Build and publish to Chromatic
        id: chromatic
        # Must run from apps/storybook-rn-expo itself — running chromatic from the
        # workspace root makes it treat the monorepo root as the Expo project and
        # run `expo prebuild` against it, corrupting root package.json/app.json.
        working-directory: apps/storybook-rn-expo
        continue-on-error: true
        # ulimit: metro.config.js sets watchFolders to the whole monorepo root, which
        # crawls far more files than the default macOS open-file limit allows on a
        # fresh runner (vs. a dev machine where this is usually raised already) — a
        # likely cause of "works locally, fails in CI" for this exact build step.
        # NODE_OPTIONS: release builds enable minification, which is far more memory-
        # hungry than the dev bundle this app is normally built with.
        # --exit-zero-on-changes: a brand-new Chromatic project has no baseline, so
        # every story is reported as a "change" needing review — that's expected,
        # not a failure, so don't let it fail the CI job. Genuine build/test errors
        # still exit non-zero and fail this step.
        run: |
          ulimit -n 65536 || true
          npx chromatic --project-token="$CHROMATIC_PROJECT_TOKEN" --exit-zero-on-changes
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN_REACT_NATIVE_EXPO }}
          NODE_OPTIONS: --max-old-space-size=8192
          # Bundle only packages/react-native/visual-tests/** (see
          # .rnstorybook/main.ts). There is no TurboSnap for native, so every
          # included story is snapshotted on both devices on every build.
          EXPO_PUBLIC_VISUAL_TESTS: 'true'

      - name: Collect Chromatic build log on failure
        if: steps.chromatic.outcome == 'failure'
        run: |
          mkdir -p chromatic-logs
          find "${TMPDIR:-/tmp}" -maxdepth 4 -path '*chromatic--*/.chromatic/react-native-build.log' -exec cp {} chromatic-logs/ \; 2>/dev/null || true
          ls -la chromatic-logs || true

      - name: Upload Chromatic build log
        if: steps.chromatic.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chromatic-react-native-build-log
          path: chromatic-logs/
          if-no-files-found: warn
          retention-days: 5

      - name: Fail job if Chromatic build failed
        if: steps.chromatic.outcome == 'failure'
        run: exit 1
