name: 'Chromatic - React Native Expo'

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/storybook-rn-expo/**'
      - 'packages/react-native/**'
      - '.github/workflows/chromatic-react-native-expo.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/storybook-rn-expo/**'
      - 'packages/react-native/**'
      - '.github/workflows/chromatic-react-native-expo.yml'

permissions:
  contents: read

jobs:
  check:
    name: Check if build should run
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Check for [skip-chromatic] marker
        id: marker
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$PR_TITLE" == *"[skip-chromatic]"* ]] || [[ "$PR_BODY" == *"[skip-chromatic]"* ]] || [[ "$COMMIT_MESSAGE" == *"[skip-chromatic]"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for non-docs changes
        id: changed
        if: steps.marker.outputs.skip == 'false'
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            apps/storybook-rn-expo/**
            packages/react-native/**
          files_ignore: |
            **/*.docs.mdx
            **/*.md
            **/*.mdx

      - name: Decide
        id: decide
        run: |
          if [[ "${{ steps.marker.outputs.skip }}" == "true" ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.changed.outputs.any_changed }}" == "true" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  chromatic:
    name: Build and publish to Chromatic
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: macos-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.8.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_GLOBAL_READ_TOKEN }}

      - name: Build and publish to Chromatic
        # Must run from apps/storybook-rn-expo itself — running chromatic from the
        # workspace root makes it treat the monorepo root as the Expo project and
        # run `expo prebuild` against it, corrupting root package.json/app.json.
        working-directory: apps/storybook-rn-expo
        run: npx chromatic --project-token="$CHROMATIC_PROJECT_TOKEN"
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN_REACT_NATIVE_EXPO }}
